# docker-compose.yml — OMS (Staging / Development with external services)
# ============================================================
# Usage:
#   cp .env.example .env      # isi nilai secret
#   docker-compose up -d
#
# Profiles:
#   default : app + postgres + redis (staging-like)
#   dev     : hanya app dengan H2 in-memory (tanpa postgres/redis)
#
# Secret wajib (set di .env atau env var sebelum run):
#   DB_PASSWORD, JWT_SECRET, REDIS_PASSWORD, ADMIN_PASSWORD
# ============================================================

services:

  # ── Application ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oms:latest
    container_name: oms-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: omsdb_staging
      DB_USERNAME: oms_user
      DB_PASSWORD: ${DB_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 3600000
      JWT_REFRESH_EXPIRATION: 604800000
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: 1
      RATE_LIMIT_DISTRIBUTED: "true"
      # App
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ERROR_BASE_URL: http://localhost:8080/errors
      HEALTH_URL: http://localhost:9090/health
      # JVM
      JAVA_OPTS: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/version"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - oms-network

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omsdb_staging
      POSTGRES_USER: oms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "oms_user", "-d", "omsdb_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oms-network

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oms-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oms-network

# ── Volumes ────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

# ── Networks ───────────────────────────────────────────────
networks:
  oms-network:
    driver: bridge
