sonar.projectKey=com.oms:oms
sonar.projectName=oms
sonar.projectVersion=0.0.1-SNAPSHOT

# PLACEHOLDER — ganti dengan organizaton slug SonarCloud Anda sebelum push.
# Dapatkan di: https://sonarcloud.io/account/organizations
# Di CI, nilai ini juga di-pass via: -Dsonar.organization=$SONAR_ORG (secrets.SONAR_ORG)
sonar.organization=oms

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

sonar.sourceEncoding=UTF-8
sonar.java.source=21

sonar.exclusions=**/dto/**,**/entity/**,**/config/**

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

sonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
sonar.java.spotbugs.reportPaths=target/spotbugsXml.xml
