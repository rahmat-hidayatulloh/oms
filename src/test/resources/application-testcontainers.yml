spring:
  # PostgreSQL (Testcontainers)
  # Note: Port is overridden at runtime by OrderFlowIntegrationTest via system properties
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1200000
      pool-name: OmsTestPool

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # Redis (Testcontainers)
  # Note: Port is overridden at runtime by OrderFlowIntegrationTest via system properties
  data:
    redis:
      host: localhost
      port: 6379
      enabled: true
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # H2 Console disabled
  h2:
    console:
      enabled: false

# JWT for testing
jwt:
  secret: test-secret-key-for-testcontainers-integration-testing-minimum-length
  expiration: 3600000

# Logging
logging:
  level:
    com.oms: DEBUG
    org.springframework: INFO
    org.hibernate: INFO
    org.testcontainers: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always