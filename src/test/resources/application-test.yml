spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Flyway manages the schema in tests too, validating against the migrations.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  cache:
    type: simple

  data:
    redis:
      enabled: false

jwt:
  secret: test-secret-key-for-unit-testing-purposes-only-minimum-length
  expiration: 3600000

app:
  # RFC 7807 ProblemDetail — pinned for the test profile so that assertions on
  # the `type` field stay hermetic and are not influenced by a developer shell
  # that exported ERROR_BASE_URL (see env/*.env) before running the build.
  error:
    base-url: https://api.oms.com/errors

  # External payment API — pinned so the health indicator does not depend on
  # a developer-supplied HEALTH_URL.
  payment:
    api:
      base-url: http://localhost:9090
      health-path: /health

# Resilience4j test defaults
resilience4j:
  circuitbreaker:
    instances:
      paymentApi:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
  retry:
    instances:
      paymentApi:
        maxAttempts: 3
        waitDuration: 100ms
        enableExponentialBackoff: false

logging:
  level:
    com.oms: DEBUG