apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod overlay — PostgreSQL + Redis required.
#   Deploy: kubectl apply -k k8s/overlays/prod
resources:
  - ../../base
  - ../../components/datastore

# V4-06: inject the active Spring profile per environment instead of
# hardcoding it in the base ConfigMap.
patches:
  - target:
      kind: ConfigMap
      name: oms-config
    patch: |-
      - op: add
        path: /data/SPRING_PROFILES_ACTIVE
        value: prod

# V4-07: restrict ingress to production CIDR range (not open to the world).
# Replace "10.0.0.0/8" with your actual production ingress CIDR (office VPN,
# CDN egress IPs, or cloud LB range) before deploying to production.
  - target:
      kind: Ingress
      name: oms-ingress
    patch: |-
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1whitelist-source-range
        value: "10.0.0.0/8"

