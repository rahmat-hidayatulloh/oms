apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay — PostgreSQL + Redis required.
#   Deploy: kubectl apply -k k8s/overlays/staging
resources:
  - ../../base
  - ../../components/datastore

# V4-06: inject the active Spring profile per environment instead of
# hardcoding it in the base ConfigMap.
patches:
  - target:
      kind: ConfigMap
      name: oms-config
    patch: |-
      - op: add
        path: /data/SPRING_PROFILES_ACTIVE
        value: staging

# V4-07: restrict ingress to staging CIDR range (not open to the world).
# Adjust the CIDR below to match your staging cluster's ingress controller
# IP range or VPN egress range.
  - target:
      kind: Ingress
      name: oms-ingress
    patch: |-
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1whitelist-source-range
        value: "10.0.0.0/8"

