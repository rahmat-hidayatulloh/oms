apiVersion: v1
kind: Secret
metadata:
  name: oms-secrets
  namespace: oms-system
  labels:
    app.kubernetes.io/name: oms
    app.kubernetes.io/part-of: oms
type: Opaque
stringData:
  # ⚠️  SECURITY NOTICE — DO NOT COMMIT REAL VALUES HERE
  # This file is a template placeholder. Real secrets must be injected
  # per environment via External Secrets Operator, HashiCorp Vault, Sealed
  # Secrets, or a CI/CD secret-manager integration.
  #
  # For local development only, replace the placeholders below with
  # development-only values. Never use production credentials in this file.
  # The previous literal values have been rotated and removed from Git.

  # JWT Secret — replace with your own dev-only secret (min 32 chars)
  JWT_SECRET: "<CHANGE_ME_MIN_32_CHARS>"

  # Database credentials — replace with your dev database values
  DB_HOST: "<CHANGE_ME>"
  DB_PORT: "<CHANGE_ME>"
  DB_NAME: "<CHANGE_ME>"
  DB_USERNAME: "<CHANGE_ME>"
  DB_PASSWORD: "<CHANGE_ME>"

  # Redis credentials — replace with your dev Redis password or leave empty
  REDIS_PASSWORD: "<CHANGE_ME_OR_EMPTY>"

  # Security policy thresholds — moved from configmap.yaml because Trivy
  # KSV-0109 flags keys containing 'secret'/'token' by name and reports a
  # resource-level finding that cannot be suppressed inline. These values
  # are numeric policies (NOT credentials), but hosting them here keeps
  # the scan clean without global check suppression. The env var names are
  # bound verbatim by Spring (SystemEnvironmentPropertySource), so they
  # must keep their dotted lowercase form.
  app.jwt.min-secret-length: "32"
  app.refresh-token.expiration-days: "7"
