apiVersion: v1
kind: Service
metadata:
  name: oms-service
  namespace: oms-system
  labels:
    app.kubernetes.io/name: oms
    app.kubernetes.io/part-of: oms
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oms
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: actuator
      port: 8081
      targetPort: 8081
      protocol: TCP
