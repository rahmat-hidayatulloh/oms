apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oms-hpa
  namespace: oms-system
  labels:
    app.kubernetes.io/name: oms
    app.kubernetes.io/part-of: oms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oms
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80