# ============================================================
# NetworkPolicy — OMS
# ============================================================
# Default-deny ingress; allow only required traffic.
# Egress is restricted to DNS, PostgreSQL, Redis, and the
# Kubernetes API (for readiness/liveness probes).
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oms-deny-all-ingress
  namespace: oms-system
  labels:
    app.kubernetes.io/name: oms
    app.kubernetes.io/part-of: oms
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []   # deny all ingress; allow rules are in separate policies
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oms-allow-ingress-from-ingress-controller
  namespace: oms-system
  labels:
    app.kubernetes.io/name: oms
    app.kubernetes.io/part-of: oms
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oms
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oms-allow-egress-postgres
  namespace: oms-system
  labels:
    app.kubernetes.io/name: oms
    app.kubernetes.io/part-of: oms
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oms
  policyTypes:
    - Egress
  egress:
    # Allow PostgreSQL traffic (staging/prod)
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow Redis traffic (staging/prod)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379